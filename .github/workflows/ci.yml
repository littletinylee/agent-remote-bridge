name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install (optional qr extra must not be required)
        run: python -m pip install -e .
      - name: install optional qr extra
        run: python -m pip install "qrcode[pil]"
      - name: lint
        run: |
          python -m pip install ruff
          ruff check src tests scripts
      - name: unit + integration tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: no identifiers leaked into committed reports
        run: python scripts/sanitize_reports.py --check
      - name: smoke test the CLI
        env:
          PYTHONPATH: src
          ARB_HOME: ${{ runner.temp }}/arb-home
        run: |
          python -m arb --version
          python -m arb init
          python -m arb status
      - name: smoke test the MCP handshake
        env:
          PYTHONPATH: src
          ARB_HOME: ${{ runner.temp }}/arb-home
        run: python scripts/mcp_smoke.py
